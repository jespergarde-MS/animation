<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mobile homepage animation prototype</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      background: #e9e9e9;
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      position: relative;
      width: min(100%, 375px);
      margin: 0 auto;
      background: #fff;
      box-shadow: 0 0 30px rgb(0 0 0 / 10%);
    }

    .site-stripe,
    .product-carousel {
      display: block;
      width: 100%;
      height: auto;
    }

    .hero {
      position: relative;
      width: 100%;
      aspect-ratio: 750 / 1157;
      overflow: hidden;
      isolation: isolate;
      background: #dce3ec;
    }

    .hero-media {
      position: absolute;
      inset: -10% 0;
      z-index: 0;
      transform: translate3d(0, 0, 0);
      will-change: transform;
    }

    .hero-image {
      display: block;
      width: 100%;
      height: 120%;
      object-fit: cover;
    }

    .hero-copy {
      position: absolute;
      z-index: 5;
      right: 0;
      bottom: 0;
      left: 0;
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
    }

    /* Natural state: the nav belongs to the hero and follows elastic pull-down.
       aspect-ratio reserves its height, since both images inside are now
       stacked with position: absolute for the crossfade. */
    .nav {
      position: absolute;
      z-index: 20;
      top: 0;
      left: 0;
      width: 100%;
      aspect-ratio: 750 / 96;
      pointer-events: auto;
      will-change: top, left;
    }

    /* Controlled state: used only after the nav has genuinely reached the top. */
    .nav.is-controlled {
      position: fixed;
    }

    .nav img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
      transition: opacity 125ms linear;
    }

    /* Explicit initial state: transparent nav fully visible, white nav fully
       transparent, so it cannot appear before JS runs. Only opacity is used
       (not visibility/display) so the 200ms crossfade can animate smoothly
       in both directions. Scoped with two classes so these rules always
       outrank a plain ".nav img" rule regardless of source order. */
    .nav .nav-transparent {
      opacity: 1;
      pointer-events: auto;
    }

    .nav .nav-white {
      opacity: 0;
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .hero-media { transform: none !important; }
      .nav img { transition: none; }
    }
    .product-carousel {
      padding-top: 60px;
    }
  </style>
</head>
<body>
  <main class="page" id="page">
    <img class="site-stripe" src="Site stripe.png" width="750" height="64" alt="Explore live shopping events">

    <section class="hero" id="hero" aria-label="Women's just arrived">
      <nav class="nav" id="nav" aria-label="Main navigation">
        <img class="nav-transparent" src="navTransparent.png" width="750" height="96" alt="">
        <img class="nav-white" src="navWhite.png" width="750" height="96" alt="">
      </nav>

      <div class="hero-media" id="heroMedia">
        <img class="hero-image" src="Hero image.jpg" width="750" height="1157" alt="Model wearing a dark jacket and checked trousers">
      </div>

      <img class="hero-copy" src="Hero copy.png" width="750" height="342" alt="What your wardrobe needs now. Women's just arrived.">
    </section>

    <img class="product-carousel" src="page.png" alt="Our top picks product carousel">
  </main>

  <script>
    (() => {
      const HOLD_DISTANCE = 300;
      const WHITE_FADE_DISTANCE = 96;
      const HERO_SCROLL_FACTOR = 0.42;

      const page = document.getElementById('page');
      const nav = document.getElementById('nav');
      const heroMedia = document.getElementById('heroMedia');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

      let triggerScrollY = null;
      let ticking = false;

      function setNaturalState() {
        nav.classList.remove('is-controlled');
        nav.style.removeProperty('top');
        nav.style.removeProperty('left');
        nav.style.removeProperty('width');
        nav.querySelector('.nav-transparent').style.removeProperty('opacity');
        nav.querySelector('.nav-white').style.removeProperty('opacity');
      }

      function setControlledGeometry(pageRect, top, whiteOpacity) {
        nav.classList.add('is-controlled');
        nav.style.left = `${pageRect.left}px`;
        nav.style.width = `${pageRect.width}px`;
        nav.style.top = `${top}px`;
        nav.querySelector('.nav-transparent').style.opacity = `${1 - whiteOpacity}`;
        nav.querySelector('.nav-white').style.opacity = `${whiteOpacity}`;
      }

      function update() {
        const scrollY = Math.max(window.scrollY, 0);
        const pageRect = page.getBoundingClientRect();

        if (!nav.classList.contains('is-controlled')) {
          // Read the nav's real viewport position while it is still part of the hero.
          // Because every image now has width/height attributes, layout is correct
          // from the very first frame, so this reflects the true starting position.
          const navTop = nav.getBoundingClientRect().top;

          if (navTop <= 0) {
            triggerScrollY = scrollY + navTop;
          }
        }

        if (triggerScrollY === null || scrollY < triggerScrollY) {
          setNaturalState();
          triggerScrollY = null;
        } else {
          const distanceAfterTrigger = scrollY - triggerScrollY;
          const whiteOpacity = Math.min(distanceAfterTrigger / WHITE_FADE_DISTANCE, 1);

          if (distanceAfterTrigger <= HOLD_DISTANCE) {
            // Fade the white nav in as the page scrolls, then hold it at full opacity.
            setControlledGeometry(pageRect, 0, whiteOpacity);
          } else {
            // Then it moves out at one pixel per scroll pixel, matching page speed.
            setControlledGeometry(pageRect, -(distanceAfterTrigger - HOLD_DISTANCE), whiteOpacity);
          }
        }

        const heroOffset = reduceMotion.matches ? 0 : scrollY * HERO_SCROLL_FACTOR;
        heroMedia.style.transform = `translate3d(0, ${heroOffset}px, 0)`;

        ticking = false;
      }

      function requestUpdate() {
        if (!ticking) {
          ticking = true;
          requestAnimationFrame(update);
        }
      }

      window.addEventListener('scroll', requestUpdate, { passive: true });
      window.addEventListener('resize', () => {
        triggerScrollY = null;
        setNaturalState();
        requestUpdate();
      }, { passive: true });
      reduceMotion.addEventListener?.('change', requestUpdate);

      // Guarantee the natural transparent state before the first measurement,
      // and re-check once everything (including images) has finished loading.
      setNaturalState();
      requestAnimationFrame(update);
      window.addEventListener('load', () => {
        triggerScrollY = null;
        requestUpdate();
      });
    })();
  </script>
</body>
</html>
